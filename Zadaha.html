                { id: 13, category: 'Процентное отношение', text: 'В первый месяц продано 360 товаров, во второй — 432. На сколько % увеличились продажи?', answer: '20%', type: 'text', solution: '(432-360)/360 · 100 = 20%\n\n✅ Ответ: 20%' },

                { id: 2, category: 'Проценты от числа', text: 'Турист прошёл 25% маршрута в первый день, 40% оставшегося — во второй, оставшиеся 90 км — в третий. Весь маршрут?', answer: 200, type: 'number', solution: '1) После 1 дня осталось 75%\n2) Во 2 день прошёл 40% от 75% = 30% всего пути\n3) За два дня 55%, осталось 45% = 90 км\n4) Весь путь: 90/0,45 = 200 км\n\n✅ Ответ: 200 км' },
                { id: 3, category: 'Проценты от числа', text: 'Кредит 500 000 руб. под 10% годовых. Через год начислены проценты, затем на общую сумму добавлен налог 13%. Сколько заплатить?', answer: 621500, type: 'number', solution: '1) 500000 · 1,1 = 550000\n2) 550000 · 1,13 = 621500 руб.\n\n✅ Ответ: 621500 рублей' },
                { id: 4, category: 'Проценты от числа', text: 'Банк начисляет 7% годовых. Какая сумма будет через 3 года, если вложить 100 000 руб. (сложные проценты)?', answer: 122504.3, type: 'number', solution: '100000 · 1,07³ = 122504,3 руб.\n\n✅ Ответ: 122504,3 рублей' },
                { id: 5, category: 'Проценты от числа', text: 'Наценка 20%, затем скидка 15% от розничной цены. Себестоимость 1600 руб. Итоговая цена?', answer: 1632, type: 'number', solution: '1) 1600 · 1,2 = 1920\n2) 1920 · 0,85 = 1632 руб.\n\n✅ Ответ: 1632 рубля' },
                { id: 6, category: 'Число по проценту', text: 'После двух снижений цены на 20% и 25% товар стал стоить 600 руб. Найдите исходную цену.', answer: 1000, type: 'number', solution: '1) 0,8 · 0,75 = 0,6\n2) 600 / 0,6 = 1000 руб.\n\n✅ Ответ: 1000 рублей' },
                { id: 7, category: 'Число по проценту', text: 'Число увеличили на 40%, потом уменьшили на 20% и получили 336. Найди исходное число.', answer: 300, type: 'number', solution: '1) 1,4 · 0,8 = 1,12\n2) 336 / 1,12 = 300\n\n✅ Ответ: 300' },
                { id: 8, category: 'Число по проценту', text: 'После увеличения на 25% и ещё на 10% сумма стала 990 руб. Найди исходную сумму.', answer: 720, type: 'number', solution: '1) 1,25 · 1,1 = 1,375\n2) 990 / 1,375 = 720 руб.\n\n✅ Ответ: 720 рублей' },
                { id: 9, category: 'Число по проценту', text: 'После трёх последовательных уменьшений на 10% товар стал стоить 6561 руб. Первоначальная цена?', answer: 9000, type: 'number', solution: '1) 0,9³ = 0,729\n2) 6561 / 0,729 = 9000 руб.\n\n✅ Ответ: 9000 рублей' },
                { id: 10, category: 'Число по проценту', text: '15% от суммы = 270 руб. Найдите сумму, увеличьте на 12%, затем уменьшите на 20%.', answer: 1612.8, type: 'number', solution: '1) 270/0,15 = 1800\n2) 1800 · 1,12 = 2016\n3) 2016 · 0,8 = 1612,8 руб.\n\n✅ Ответ: 1612,8 рублей' },
                { id: 11, category: 'Процентное отношение', text: 'За полгода предприятие выпустило 8400 изделий, в предыдущем — 9600. На сколько % сократилось производство?', answer: '12.5%', type: 'text', solution: '(9600-8400)/9600 · 100 = 12,5%\n\n✅ Ответ: 12,5%' },
                { id: 12, category: 'Процентное отношение', text: 'В классе 24 ученика. 18 сдали на 4-5. Через месяц 2 улучшили оценки. Какой % теперь сдал хорошо?', answer: '83.33%', type: 'text', solution: '(18+2)/24 · 100 = 83,33%\n\n✅ Ответ: 83,33%' },
                { id: 13, category: 'Процентное отношение', text: 'Стоимость оборудования снизилась с 2 млн до 1,56 млн. На сколько % произошло снижение?', answer: '22%', type: 'text', solution: '(2-1,56)/2 · 100 = 22%\n\n✅ Ответ: 22%' },
                { id: 14, category: 'Процентное отношение', text: 'Сотрудник отработал 168 часов, из них 42 — в выходные. Какой % времени пришёлся на выходные?', answer: '25%', type: 'text', solution: '42/168 · 100 = 25%\n\n✅ Ответ: 25%' },
                { id: 15, category: 'Процентное отношение', text: 'Инвестировал 120 000 руб. За 3 года получил 45 000 руб. прибыли. Какой это % в год (среднегодовой)?', answer: '12.5%', type: 'text', solution: '1) 45000/120000 · 100 = 37,5%\n2) 37,5/3 = 12,5%\n\n✅ Ответ: 12,5% годовых' }
            ]
        };

        // Состояние для всех задач
        const state = {};

        // Инициализация состояния
        function initState() {
            for (let cls in taskBanks) {
                taskBanks[cls].forEach((_, idx) => {
                    const key = cls + '-' + idx;
                    state[key] = { attempts: 0, isCorrect: false, isRevealed: false, isFailed: false };
                });
            }
        }
        initState();

        // Рендер одной задачи (без кнопки сброса)
        function renderTask(task, cls, idx) {
            const key = cls + '-' + idx;
            const st = state[key];
            const card = document.createElement('div');
            card.className = 'task-card';
            card.dataset.key = key;

            const header = document.createElement('div');
            header.className = 'task-header';
            header.innerHTML = `
                <span class="task-id">Задача ${task.id}</span>
                <span class="task-category">${task.category}</span>
            `;
            card.appendChild(header);

            const text = document.createElement('div');
            text.className = 'task-text';
            text.textContent = task.text;
            card.appendChild(text);

            const answerArea = document.createElement('div');
            answerArea.className = 'answer-area';

            const inputGroup = document.createElement('div');
            inputGroup.className = 'input-group';
            const label = document.createElement('label');
            label.textContent = 'Ответ:';
            const input = document.createElement('input');
            input.type = task.type === 'number' ? 'number' : 'text';
            input.step = 'any';
            input.placeholder = task.type === 'number' ? 'Введите число' : 'Введите ответ';
            input.className = 'task-input';
            input.id = `input-${key}`;
            input.autocomplete = 'off';
            inputGroup.appendChild(label);
            inputGroup.appendChild(input);
            answerArea.appendChild(inputGroup);

            const attemptBadge = document.createElement('span');
            attemptBadge.className = 'attempt-badge';
            attemptBadge.id = `attempt-${key}`;
            attemptBadge.textContent = `попыток: 0 / 3`;
            answerArea.appendChild(attemptBadge);
            card.appendChild(answerArea);

            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';

            const checkBtn = document.createElement('button');
            checkBtn.className = 'btn btn-primary';
            checkBtn.textContent = '✓ Проверить';
            checkBtn.id = `check-${key}`;

            const solveBtn = document.createElement('button');
            solveBtn.className = 'btn btn-success';
            solveBtn.textContent = '📖 Решение';
            solveBtn.id = `solve-${key}`;
            solveBtn.disabled = true;

            btnGroup.appendChild(checkBtn);
            btnGroup.appendChild(solveBtn);
            card.appendChild(btnGroup);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${key}`;
            feedback.innerHTML = `<span style="color:#6c889e;">⬅️ Введите ответ и нажмите "Проверить"</span>`;
            card.appendChild(feedback);

            // Обработчики
            checkBtn.addEventListener('click', () => handleCheck(key, cls, idx));
            solveBtn.addEventListener('click', () => handleSolve(key));

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleCheck(key, cls, idx);
                }
            });

            updateUI(key);
            return card;
        }

        // Обработчики (без сброса)
        function handleCheck(key, cls, idx) {
            const task = taskBanks[cls][idx];
            const st = state[key];
            const inputEl = document.getElementById(`input-${key}`);
            if (!inputEl) return;

            if (st.isCorrect) {
                setFeedback(key, '✅ Задача уже решена верно!', 'success');
                return;
            }
            if (st.isFailed) {
                setFeedback(key, '❌ Задача решена неверно!', 'danger');
                return;
            }
            if (st.attempts >= 3) {
                st.isFailed = true;
                setFeedback(key, '❌ Задача решена неверно!', 'danger');
                document.getElementById(`solve-${key}`).disabled = false;
                updateUI(key);
                return;
            }

            const userAnswer = inputEl.value.trim();
            if (userAnswer === '') {
                setFeedback(key, '✏️ Введите ответ.', 'warning');
                return;
            }

            let isAnswerCorrect = false;
            const correctAnswer = task.answer;

            if (task.type === 'number') {
                const numUser = parseFloat(userAnswer.replace(',', '.').replace(/\s/g, ''));
                if (!isNaN(numUser)) {
                    isAnswerCorrect = Math.abs(numUser - correctAnswer) < 0.01;
                }
            } else {
                const normUser = userAnswer.toLowerCase().replace(/\s+/g, ' ').trim();
                const normCorrect = String(correctAnswer).toLowerCase().replace(/\s+/g, ' ').trim();
                if (normUser === normCorrect) {
                    isAnswerCorrect = true;
                } else {
                    const numMatch = userAnswer.match(/(\d+\.?\d*)/);
                    const numCorrect = String(correctAnswer).match(/(\d+\.?\d*)/);
                    if (numMatch && numCorrect) {
                        const uNum = parseFloat(numMatch[0]);
                        const cNum = parseFloat(numCorrect[0]);
                        if (!isNaN(uNum) && !isNaN(cNum) && Math.abs(uNum - cNum) < 0.01) {
                            const hasPercentUser = userAnswer.includes('%');
                            const hasPercentCorrect = String(correctAnswer).includes('%');
                            if (hasPercentUser === hasPercentCorrect) {
                                isAnswerCorrect = true;
                            }
                        }
                    }
                }
            }

            st.attempts += 1;

            if (isAnswerCorrect) {
                st.isCorrect = true;
                setFeedback(key, '✅ <strong>Правильно! Отлично!</strong>', 'success');
                document.getElementById(`solve-${key}`).disabled = false;
                updateUI(key);
                return;
            } else {
                const remaining = 3 - st.attempts;
                let msg = `❌ Неверно. Попытка ${st.attempts} из 3.`;
                if (remaining > 0) msg += ` Осталось попыток: ${remaining}`;
                setFeedback(key, msg, 'danger');
                if (st.attempts >= 3) {
                    st.isFailed = true;
                    document.getElementById(`solve-${key}`).disabled = false;
                    setFeedback(key, '❌ Задача решена неверно!', 'danger');
                }
                updateUI(key);
            }
        }

        function handleSolve(key) {
            const st = state[key];
            if (!st.isCorrect && !st.isFailed) {
                document.getElementById(`solve-${key}`).disabled = true;
                return;
            }
            const feedbackEl = document.getElementById(`feedback-${key}`);
            let sol = '';
            for (let cls in taskBanks) {
                const idx = taskBanks[cls].findIndex((_, i) => (cls + '-' + i) === key);
                if (idx !== -1) {
                    sol = taskBanks[cls][idx].solution || 'Решение не предоставлено.';
                    break;
                }
            }
            let html = `<span class="status-msg text-info">💡 <strong>Решение:</strong></span>`;
            html += `<div class="solution-block">${sol}</div>`;
            feedbackEl.innerHTML = html;
            st.isRevealed = true;
        }

        function updateUI(key) {
            const st = state[key];
            const badge = document.getElementById(`attempt-${key}`);
            if (badge) badge.textContent = `попыток: ${st.attempts} / 3`;
            const solveBtn = document.getElementById(`solve-${key}`);
            if (solveBtn) solveBtn.disabled = !(st.isCorrect || st.isFailed);
        }

        function setFeedback(key, message, type = 'info') {
            const el = document.getElementById(`feedback-${key}`);
            if (!el) return;
            let colorClass = '';
            if (type === 'success') colorClass = 'text-success';
            else if (type === 'danger') colorClass = 'text-danger';
            else if (type === 'warning') colorClass = 'text-warning';
            else colorClass = 'text-info';
            el.innerHTML = `<span class="status-msg ${colorClass}">${message}</span>`;
        }

        // Рендер всех классов
        function renderAll(activeClass = '6') {
            const container6 = document.getElementById('class6');
            const container7 = document.getElementById('class7');
            const container8 = document.getElementById('class8');
            const container9 = document.getElementById('class9');

            container6.innerHTML = '';
            container7.innerHTML = '';
            container8.innerHTML = '';
            container9.innerHTML = '';

            let header6 = document.createElement('div');
            header6.className = 'class-label';
            header6.innerHTML = '6 класс <small>базовые задачи</small>';
            container6.appendChild(header6);
            taskBanks[6].forEach((task, idx) => {
                container6.appendChild(renderTask(task, 6, idx));
            });

            let header7 = document.createElement('div');
            header7.className = 'class-label';
            header7.innerHTML = '7 класс <small>повышенный уровень</small>';
            container7.appendChild(header7);
            taskBanks[7].forEach((task, idx) => {
                container7.appendChild(renderTask(task, 7, idx));
            });

            let header8 = document.createElement('div');
            header8.className = 'class-label';
            header8.innerHTML = '8 класс <small>сложные проценты</small>';
            container8.appendChild(header8);
            taskBanks[8].forEach((task, idx) => {
                container8.appendChild(renderTask(task, 8, idx));
            });

            let header9 = document.createElement('div');
            header9.className = 'class-label';
            header9.innerHTML = '9 класс <small>практико-ориентированные</small>';
            container9.appendChild(header9);
            taskBanks[9].forEach((task, idx) => {
                container9.appendChild(renderTask(task, 9, idx));
            });

            showClass(activeClass);
        }

        function showClass(cls) {
            const sections = document.querySelectorAll('.class-section');
            sections.forEach(el => el.classList.add('hidden'));
            if (cls === 'all') {
                sections.forEach(el => el.classList.remove('hidden'));
            } else {
                const target = document.getElementById('class' + cls);
                if (target) target.classList.remove('hidden');
            }
            document.querySelectorAll('.nav-class a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`.nav-class a[data-class="${cls}"]`);
            if (link) link.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderAll('6');

            document.querySelectorAll('.nav-class a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const cls = this.dataset.class;
                    showClass(cls);
                });
            });
        });

    })();
 
</script>
